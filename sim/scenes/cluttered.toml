# Many things of different heights that hide each other, lit from one side.
name = "cluttered"
description = "A crowded surface with things that hide each other, under uneven light."

[surface]
outline_m = [[0.0, 0.0], [0.9, 0.0], [0.9, 0.75], [0.0, 0.75]]
lip_height_m = 0.02
friction = 0.5
colour = "wood"

[light]
ambient = 0.12
key = { from_m = [1.1, -0.3, 0.5], strength = 0.8 }
fill = { from_m = [-0.2, 0.9, 0.9], strength = 0.1 }

[[fixtures]]
kind = "box"
name = "tower"
at_m = [0.56, 0.50]
size_m = [0.08, 0.06, 0.14]
colour = "steel"

