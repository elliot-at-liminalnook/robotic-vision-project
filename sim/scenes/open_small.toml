# The easiest place to orient in: a small bare surface, one arm, one camera, the rover, two objects.
name = "open_small"
description = "A small bare surface with one arm, one fixed camera, the rover and two objects."

[surface]
outline_m = [[0.0, 0.0], [0.8, 0.0], [0.8, 0.6], [0.0, 0.6]]
lip_height_m = 0.02
friction = 0.5
colour = "wood"

[[objects]]
name = "red_cube"
shape = "box"
size_m = [0.03, 0.03, 0.03]
mass_kg = 0.03
colour = "red"
at_m = [0.38, 0.33]

[[objects]]
name = "blue_cylinder"
shape = "cylinder"
size_m = [0.03, 0.06]
mass_kg = 0.025
colour = "blue"
at_m = [0.33, 0.18]

[[devices]]
kind = "arm"
name = "arm"
at_m = [0.14, 0.27]
facing_deg = 0

[[devices]]
kind = "camera"
name = "camera_1"
at_m = [0.76, 0.55, 0.36]
looking_at_m = [0.30, 0.27, 0.0]

[[devices]]
kind = "rover"
name = "rover"
at_m = [0.66, 0.10]              # parked clear of both objects and of the arm's reach, with the surface ahead of it to look
facing_deg = 90                  # at: its stowed head reaches 0.25 m ahead and 0.12 m to each side

[[tasks]]
name = "where_is_everyone"
request = "Work out where the rover is relative to the arm: its position in the arm's own frame (x ahead of it, y to its left), in metres."

[[tasks.goals]]
kind = "answer_pose"
key = "pose"
of = "rover"
relative_to = "arm"
tolerance = 0.03

[[tasks]]
name = "how_big"
request = "How large is the surface you are standing on? Give its area in square metres."

[[tasks.goals]]
kind = "answer_number"
key = "area_m2"
truth = "surface_area_m2"
relative_tolerance = 0.1
